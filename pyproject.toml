[project]
name = "adx-analysis-skill"
version = "0.1.2"
description = "Portable read-only operational metrics API skill"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/adx-analysis/scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
